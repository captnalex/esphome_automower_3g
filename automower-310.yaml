script:
  - id: persist_skip_state
    mode: single
    then:
      - lambda: |-
          // Flush restoring-global components before syncing NVS. ESPHome's
          // id(...) shorthand accesses the value, so component pointers are used here.
          skip_day->update();
          skip_restore_auto->update();
          skip_release->update();
          skip_suspended->update();
          global_preferences->sync();
  - id: synchronize_date_time
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(pin_accepted) && id(last_status_ms) != 0 &&
              (uint32_t)(millis() - id(last_status_ms)) < 15000 &&
              (id(operating_status).state == "Parked" || id(operating_status).state == "Charging") &&
              id(pending_control) == 255 && id(ha_time).now().is_valid() && !id(apply_timer).is_running();
          then:
            - lambda: |-
                id(date_failed) = false;
                id(clock_sync_success) = false;
                id(date_baseline) = id(date_revision);
            - delay: 500ms
            - uart.write:
                id: mower_uart
                data: [0x02,0x02,0x01,0x01,0xD5,0x03]
            - wait_until:
                condition:
                  lambda: 'return id(date_revision) != id(date_baseline) || id(date_failed);'
                timeout: 5s
            - if:
                condition:
                  lambda: 'return !id(date_failed) && id(date_revision) != id(date_baseline) && id(ha_time).now().is_valid();'
                then:
                  - lambda: |-
                      auto now = id(ha_time).now();
                      // Preserve the mower's existing date/time display-format byte.
                      id(sync_date_target) = {uint16_t(now.year), now.month, now.day_of_month, id(date_values)[3]};
                      std::vector<uint8_t> telegram = {0x02,0x02,0x06,0x81,
                        uint8_t(now.year), uint8_t(now.year >> 8), now.month, now.day_of_month,
                        uint8_t(id(date_values)[3]),0,0x03};
                      uint8_t crc = 0;
                      for (size_t i = 1; i < telegram.size() - 2; i++) {
                        uint8_t value = telegram[i];
                        for (int bit = 0; bit < 8; bit++) {
                          const bool mix = (crc ^ value) & 1;
                          crc >>= 1;
                          if (mix) crc ^= 0x8C;
                          value >>= 1;
                        }
                      }
                      telegram[telegram.size() - 2] = crc;
                      id(mower_uart).write_array(telegram.data(), telegram.size());
                      id(last_control_command).publish_state("Date sent; waiting for readback");
                  - delay: 2s
                  - lambda: 'id(date_baseline) = id(date_revision);'
                  - uart.write:
                      id: mower_uart
                      data: [0x02,0x02,0x01,0x01,0xD5,0x03]
                  - wait_until:
                      condition:
                        lambda: 'return id(date_revision) != id(date_baseline) || id(date_failed);'
                      timeout: 5s
                  - if:
                      condition:
                        lambda: 'return !id(date_failed) && id(date_revision) != id(date_baseline) && id(date_values) == id(sync_date_target);'
                      then:
                        - script.execute: synchronize_clock
                        - script.wait: synchronize_clock
                        - lambda: |-
                            const auto now = id(ha_time).now();
                            const bool same_day = now.is_valid() && now.year == id(sync_date_target)[0] &&
                                now.month == id(sync_date_target)[1] && now.day_of_month == id(sync_date_target)[2];
                            id(last_control_command).publish_state(id(clock_sync_success) && same_day ?
                                "Date and clock confirmed by readback" :
                                "Date confirmed; clock/day not confirmed - retry when parked");
                      else:
                        - text_sensor.template.publish:
                            id: last_control_command
                            state: "Date write not confirmed; clock not changed"
                else:
                  - text_sensor.template.publish:
                      id: last_control_command
                      state: "Date read failed; no settings written"
          else:
            - text_sensor.template.publish:
                id: last_control_command
                state: "Date/clock sync requires parked/charging, PIN, fresh status and HA time"

  - id: apply_timer
    mode: single
    then:
      - lambda: |-
          id(write_endpoint) = -1;
          const int index = id(loaded_endpoint);
          if (!id(allow_timer_changes).state || !(
          id(pin_accepted) && id(last_status_ms) != 0 &&
          (uint32_t)(millis() - id(last_status_ms)) < 15000 &&
          (id(operating_status).state == "Parked" || id(operating_status).state == "Charging") &&
          id(pending_control) == 255
              ) || id(synchronize_date_time).is_running() || id(synchronize_clock).is_running() ||
              index < 0 || id(timer_endpoint).active_index().value_or(99) != index ||
              id(timer_seen)[index] == 0 || (uint32_t)(millis() - id(timer_seen)[index]) > 90000 ||
              id(timer_cache)[index] != id(loaded_timer)) {
            id(schedule_result).publish_state("Blocked: enable editing, park mower and load a fresh endpoint");
            return;
          }
          const std::string time = id(timer_draft_time).state;
          const std::string days = id(timer_draft_days).state;
          if (time.size() != 5 || time[2] != ':' ||
              time[0] < '0' || time[0] > '9' || time[1] < '0' || time[1] > '9' ||
              time[3] < '0' || time[3] > '9' || time[4] < '0' || time[4] > '9') {
            id(schedule_result).publish_state("Invalid time: use HH:MM (24:00 disables this endpoint)"); return;
          }
          const int hour = (time[0]-'0')*10 + time[1]-'0';
          const int minute = (time[3]-'0')*10 + time[4]-'0';
          if (hour > 24 || minute > 59 || (hour == 24 && minute != 0)) {
            id(schedule_result).publish_state("Invalid time range"); return;
          }
          const char *names[] = {"Mon","Tue","Wed","Thu","Fri","Sat","Sun"};
          uint8_t mask = 0;
          size_t pos = 0;
          while (pos < days.size()) {
            size_t end = pos;
            while (end < days.size() && days[end] != ',') end++;
            const bool last = end == days.size();
            const std::string token = days.substr(pos, end-pos);
            int day = -1;
            for (int j=0; j<7; j++) if (token == names[j]) day = j;
            if (day < 0 || (mask & (1U << day)) || (!last && end+1 == days.size())) {
              id(schedule_result).publish_state("Use unique Mon,Tue,Wed,Thu,Fri,Sat,Sun without spaces; empty means no days"); return;
            }
            mask |= 1U << day;
            if (last) break;
            pos = end + 1;
          }
          id(write_endpoint) = index;
          id(write_hour) = hour; id(write_minute) = minute; id(write_days) = mask;
          id(write_failed) = false;
      - if:
          condition:
            lambda: 'return id(write_endpoint) >= 0;'
          then:
            - delay: 500ms
            - lambda: |-
                const int index = id(write_endpoint);
                const uint8_t endpoint = (index % 2 + 1) | (index >= 2 ? 0x80 : 0);
                // Documented write layout, including A0 05; do not reuse opaque read-only bytes.
                std::vector<uint8_t> telegram = {0x02,0x06,0x08,0x02,endpoint,
                  id(write_hour),0,id(write_minute),id(write_days),0xA0,0x05,0,0x03};
                uint8_t crc = 0;
                for (size_t i = 1; i < telegram.size() - 2; i++) {
                  uint8_t value = telegram[i];
                  for (int bit = 0; bit < 8; bit++) {
                    const bool mix = (crc ^ value) & 1;
                    crc >>= 1;
                    if (mix) crc ^= 0x8C;
                    value >>= 1;
                  }
                }
                telegram[telegram.size() - 2] = crc;
                id(mower_uart).write_array(telegram.data(), telegram.size());
                id(schedule_result).publish_state("Timer write sent; waiting for readback");
            - delay: 2s
            - lambda: |-
                const int index = id(write_endpoint);
                id(write_revision) = id(timer_revision)[index];
                const uint8_t endpoint = (index % 2 + 1) | (index >= 2 ? 0x80 : 0);
                std::vector<uint8_t> telegram = {0x02,0x06,0x02,0x01,endpoint,0,0x03};
                uint8_t crc = 0;
                for (size_t i = 1; i < telegram.size() - 2; i++) {
                  uint8_t value = telegram[i];
                  for (int bit = 0; bit < 8; bit++) {
                    const bool mix = (crc ^ value) & 1;
                    crc >>= 1;
                    if (mix) crc ^= 0x8C;
                    value >>= 1;
                  }
                }
                telegram[telegram.size() - 2] = crc;
                id(mower_uart).write_array(telegram.data(), telegram.size());
            - wait_until:
                condition:
                  lambda: 'return id(write_failed) || id(timer_revision)[id(write_endpoint)] != id(write_revision);'
                timeout: 5s
            - lambda: |-
                const int index = id(write_endpoint);
                const auto &value = id(timer_cache)[index];
                const bool matched = !id(write_failed) && id(timer_revision)[index] != id(write_revision) &&
                    value[0] == id(write_hour) && value[1] == 0 && value[2] == id(write_minute) &&
                    value[3] == id(write_days) && (id(write_hour) != 24 || value[6] == 0);
                id(schedule_result).publish_state(matched ?
                    "Endpoint confirmed by readback; check enabled state and both endpoints on mower" :
                    "Write NOT confirmed; may have applied - inspect mower before retrying");
                id(loaded_endpoint) = -1;
                id(write_endpoint) = -1;

  - id: synchronize_clock
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(ha_time).now().is_valid() &&
                     id(pin_accepted) &&
                     id(last_response_ms) != 0 &&
                     (uint32_t)(millis() - id(last_response_ms)) < 30000 &&
                     id(last_status_ms) != 0 &&
                     (uint32_t)(millis() - id(last_status_ms)) < 30000 &&
                     (id(operating_status).state == "Charging" ||
                      id(operating_status).state == "Parked") &&
                     !id(change_mode).is_running() && id(pending_control) == 255;
          then:
            - lambda: |-
                id(clock_sync_success) = false;
                auto now_ms = id(ha_time).now();
                if (now_ms.hour > 23 || now_ms.minute > 59 || now_ms.second > 59) {
                  ESP_LOGE("automower", "Invalid time from Home Assistant");
                  return;
                }
                id(clock_sync_hour) = uint8_t(now_ms.hour);
                id(clock_sync_minute) = uint8_t(now_ms.minute);
                id(clock_sync_second) = uint8_t(now_ms.second);
                id(clock_sync_pending) = true;
                id(clock_sync_readback_sent) = false;
                uint8_t telegram[9] = {
                  0x02, 0x02, 0x04, 0x80,
                  id(clock_sync_hour), id(clock_sync_minute), id(clock_sync_second),
                  0x00, 0x03
                };
                uint8_t crc = 0;
                for (size_t i = 1; i <= 6; i++) {
                  uint8_t value = telegram[i];
                  for (int bit = 0; bit < 8; bit++) {
                    const bool mix = (crc ^ value) & 0x01;
                    crc >>= 1;
                    if (mix) crc ^= 0x8C;
                    value >>= 1;
                  }
                }
                telegram[7] = crc;
                id(mower_uart).write_array(telegram, sizeof(telegram));
                id(last_control_command).publish_state("Clock sync sent - waiting for response");
                ESP_LOGI("automower", "Setting mower clock to %02u:%02u:%02u",
                         unsigned(now_ms.hour), unsigned(now_ms.minute), unsigned(now_ms.second));
            - delay: 2s
            - if:
                condition:
                  lambda: 'return id(clock_sync_pending);'
                then:
                  - lambda: 'id(clock_sync_readback_sent) = true;'
                  - uart.write:
                      id: mower_uart
                      data: [0x02, 0x02, 0x01, 0x00, 0x8B, 0x03]
            - delay: 3s
            - lambda: |-
                if (id(clock_sync_pending)) {
                  id(clock_sync_pending) = false;
                  id(clock_sync_readback_sent) = false;
                  id(last_control_command).publish_state("Clock sync not confirmed (timeout)");
                  ESP_LOGW("automower", "Clock sync: no confirmed readback after write attempt");
                }
          else:
            - text_sensor.template.publish:
                id: last_control_command
                state: "Clock sync requires parked/charging, PIN and connection"
            - logger.log:
                level: WARN
                format: "Clock sync blocked: requires parked/charging, accepted PIN, fresh AUX status and HA time"

  # PIN is converted from decimal text; leading zeros are preserved in configuration.
  # Never log the PIN or expose it as a Home Assistant entity.
  - id: authenticate
    mode: restart
    then:
      - lambda: |-
          const std::string pin_text = "${automower_pin}";
          id(pin_accepted) = false;
          id(pin_requested) = true;
          if (pin_text.size() != 4 ||
              pin_text.find_first_not_of("0123456789") != std::string::npos) {
            id(pin_status).publish_state("Invalid PIN configuration: four digits required");
            ESP_LOGE("automower", "Invalid PIN configuration; authentication not sent");
            return;
          }
          uint16_t pin = 0;
          for (char digit : pin_text) pin = pin * 10 + (digit - '0');
          id(pin_status).publish_state("Waiting for response");
          uint8_t telegram[9] = {0x02, 0x0C, 0x04, 0x00, 0x01,
                                 uint8_t(pin & 0xFF), uint8_t(pin >> 8), 0x00, 0x03};
          uint8_t crc = 0;
          for (int i = 1; i <= 6; i++) {
            uint8_t value = telegram[i];
            for (int bit = 0; bit < 8; bit++) {
              const bool mix = (crc ^ value) & 0x01;
              crc >>= 1;
              if (mix) crc ^= 0x8C;
              value >>= 1;
            }
          }
          telegram[7] = crc;
          id(mower_uart).write_array(telegram, sizeof(telegram));

  # Only one outstanding control command. The protocol has no transaction IDs.
  - id: send_control
    mode: single
    parameters:
      command: int
    then:
      - lambda: |-
          if (command < 0 || command > 4) return;
          const uint32_t now_ms = millis();
          if (command != 0 && (id(pending_control) != 255 ||
              (id(control_sent_ms) != 0 && (uint32_t)(now_ms - id(control_sent_ms)) < 5000))) {
            id(last_control_command).publish_state("Control blocked (busy/cooldown)");
            return;
          }
          // STOP remains available. If it interrupts a recent command, its ACK
          // cannot be distinguished from the old ACK: never claim confirmation.
          id(control_ack_ambiguous) = command == 0 &&
              (id(pending_control) != 255 || (id(control_sent_ms) != 0 &&
               (uint32_t)(now_ms - id(control_sent_ms)) < 5000));
          id(pending_control) = command;
          id(control_sent_ms) = now_ms;
          id(control_acknowledged) = false;
          const char *labels[] = {"STOP", "START", "HOME", "MAN", "AUTO"};
          id(control_label) = labels[command];
          static const uint8_t frames[5][6] = {
            {0x02,0x0E,0x01,0x00,0x30,0x03},
            {0x02,0x0E,0x01,0x01,0x6E,0x03},
            {0x02,0x0E,0x01,0x02,0x8C,0x03},
            {0x02,0x0E,0x01,0x03,0xD2,0x03},
            {0x02,0x0E,0x01,0x04,0x51,0x03}
          };
          id(mower_uart).write_array(frames[command], 6);
          id(last_control_command).publish_state(id(control_label) + " sent; waiting for acknowledgement");

  - id: change_mode
    mode: single
    parameters:
      mode: int
    then:
      - script.execute:
          id: send_control
          command: !lambda 'return mode;'

select:
  - platform: template
    name: "Timer endpoint to edit"
    id: timer_endpoint
    optimistic: true
    initial_option: "Timer 1 start"
    options:
      - "Timer 1 start"
      - "Timer 2 start"
      - "Timer 1 end"
      - "Timer 2 end"
  - platform: template
    name: "Select operating mode"
    id: select_operating_mode
    icon: mdi:robot-mower
    options:
      - "AUTO"
      - "MAN"
      - "HOME"
    optimistic: false
    update_interval: never
    lambda: |-
      return {};
    set_action:
      - lambda: |-
          if (x != "AUTO" && x != "MAN" && x != "HOME") return;
          if (!id(pin_accepted) ||
              id(last_response_ms) == 0 ||
              (uint32_t)(millis() - id(last_response_ms)) >= 30000 ||
              id(skip_day) != 0 || id(skip_release) ||
              id(apply_timer).is_running() || id(synchronize_date_time).is_running() ||
              id(pending_control) != 255 ||
              id(change_mode).is_running() ||
              id(synchronize_clock).is_running()) {
            id(last_control_command).publish_state("Mode blocked (PIN/connection/busy)");
            ESP_LOGW("automower", "Mode selection blocked: %s", x.c_str());
            return;
          }
          const int mode = x == "HOME" ? 2 : (x == "MAN" ? 3 : 4);
          char message[48];
          snprintf(message, sizeof(message), "Mode %s requested", x.c_str());
          id(last_control_command).publish_state(message);
          id(change_mode)->execute(mode);

button:
  - platform: template
    name: "Load timer for editing"
    on_press:
      - lambda: |-
          if (id(apply_timer).is_running()) return;
          const int index = id(timer_endpoint).active_index().value_or(99);
          if (index > 3 || id(timer_seen)[index] == 0 ||
              (uint32_t)(millis() - id(timer_seen)[index]) > 90000) {
            id(loaded_endpoint) = -1;
            id(schedule_result).publish_state("No fresh timer reading; wait for polling while mower is awake"); return;
          }
          id(loaded_endpoint) = index;
          id(loaded_timer) = id(timer_cache)[index];
          char time[8];
          snprintf(time, sizeof(time), "%02u:%02u", id(loaded_timer)[0], id(loaded_timer)[2]);
          id(timer_draft_time).publish_state(time);
          std::string days;
          const char *names[] = {"Mon","Tue","Wed","Thu","Fri","Sat","Sun"};
          for (int j=0; j<7; j++) if (id(loaded_timer)[3] & (1U << j)) {
            if (!days.empty()) days += ",";
            days += names[j];
          }
          id(timer_draft_days).publish_state(days);
          id(schedule_result).publish_state("Draft loaded; edit then Apply (one endpoint only)");
  - platform: template
    name: "Apply timer endpoint"
    on_press:
      - script.execute: apply_timer
  - platform: template
    name: "Skip mowing today"
    on_press:
      - lambda: |-
          const auto now = id(ha_time).now();
          if (!now.is_valid() || !id(pin_accepted) || id(last_status_ms) == 0 ||
              (uint32_t)(millis() - id(last_status_ms)) >= 15000) {
            id(skip_status).publish_state("Skip blocked: requires valid HA time, PIN and fresh mower status"); return;
          }
          if (id(skip_day) == 0 && !id(skip_release))
            id(skip_restore_auto) = id(operating_mode).state == "AUTO";
          id(skip_day) = now.year * 10000UL + now.month * 100UL + now.day_of_month;
          id(skip_suspended) = false;
          id(skip_release) = false;
          id(skip_last_attempt) = 0;
          id(skip_status).publish_state("Skip requested; waiting to confirm HOME mode");
          id(persist_skip_state).execute();
  - platform: template
    name: "Cancel skip today"
    on_press:
      - lambda: |-
          if (id(skip_day) == 0) return;
          id(skip_day) = 0;
          id(skip_release) = id(skip_restore_auto);
          id(skip_last_attempt) = 0;
          id(skip_status).publish_state(id(skip_release) ? "Cancel requested; waiting to restore AUTO" : "Skip cancelled; mode left unchanged");
          id(persist_skip_state).execute();
  - platform: template
    name: "Synchronize date and clock"
    icon: mdi:clock-sync
    on_press:
      - script.execute: synchronize_date_time
  - platform: template
    name: "Authenticate PIN"
    on_press:
      - script.execute: authenticate
  - platform: template
    name: "Stop mower"
    on_press:
      - script.stop: change_mode
      - script.stop: synchronize_clock
      - script.stop: synchronize_date_time
      - script.stop: apply_timer
      - lambda: |-
          id(skip_restore_auto) = false;
          id(skip_release) = false;
          id(skip_suspended) = true;
          id(persist_skip_state).execute();
          id(loaded_endpoint) = -1;
          id(schedule_result).publish_state("Interrupted by STOP; read mower settings before retrying");
      - lambda: |-
          id(clock_sync_pending) = false;
          id(clock_sync_readback_sent) = false;
      - script.execute:
          id: send_control
          command: 0
  - platform: template
    name: "Start mower"
    on_press:
      - if:
          condition:
            lambda: 'return id(pin_accepted) && id(skip_day) == 0 && !id(skip_release) && !id(apply_timer).is_running() && !id(synchronize_date_time).is_running() && id(pending_control) == 255 && !id(synchronize_clock).is_running() && id(last_response_ms) != 0 && (uint32_t)(millis() - id(last_response_ms)) < 30000;'
          then:
            - script.execute:
                id: send_control
                command: 1
          else:
            - text_sensor.template.publish:
                id: last_control_command
                state: "START blocked (PIN/connection/busy)"
  - platform: template
    name: "Refresh status"
    on_press:
      - uart.write:
          id: mower_uart
          data: [0x02, 0x12, 0x01, 0x01, 0x9F, 0x03]

# Keep status polling during control acknowledgement/readback; pause for clock sync.
interval:
  - interval: 5s
    then:
      - lambda: |-
          const auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          const uint32_t today = now.year * 10000UL + now.month * 100UL + now.day_of_month;
          if (id(skip_day) != 0 && today > id(skip_day)) {
            id(skip_day) = 0;
            id(skip_release) = id(skip_restore_auto);
            id(skip_last_attempt) = 0;
            id(skip_status).publish_state(id(skip_release) ? "New day; waiting to restore AUTO" : "Skip ended; mode left unchanged");
            id(persist_skip_state).execute();
          }
          if (id(skip_day) == 0 && !id(skip_release)) return;
          if (id(skip_suspended)) {
            id(skip_status).publish_state("Skip retained; automatic commands suspended by STOP");
            return;
          }
          if (!id(pin_accepted) || id(last_status_ms) == 0 ||
              (uint32_t)(millis() - id(last_status_ms)) >= 15000 ||
              id(pending_control) != 255 || id(apply_timer).is_running() ||
              id(synchronize_clock).is_running() || id(synchronize_date_time).is_running()) return;
          if (id(skip_day) != 0 && id(operating_mode).state == "HOME") {
            id(skip_status).publish_state("Skipping today; HOME mode observed"); return;
          }
          if (id(skip_release) && id(operating_mode).state == "AUTO") {
            id(skip_release) = false; id(skip_restore_auto) = false;
            id(skip_status).publish_state("Skip ended; AUTO mode observed");
            id(persist_skip_state).execute(); return;
          }
          if (id(skip_release) && id(operating_status).state == "Error") return;
          if (id(skip_last_attempt) != 0 && (uint32_t)(millis() - id(skip_last_attempt)) < 60000) return;
          id(skip_last_attempt) = millis();
          id(send_control)->execute(id(skip_day) != 0 ? 2 : 4);
  - interval: 500ms
    then:
      - lambda: |-
          if (id(pending_control) != 255 &&
              (uint32_t)(millis() - id(control_sent_ms)) >= 20000) {
            std::string result = id(control_label);
            if (id(control_ack_ambiguous)) result += " sent; acknowledgement ambiguous after interrupted command";
            else if (id(control_acknowledged)) result += " acknowledged; requested state not observed (timeout)";
            else result += " not confirmed (acknowledgement timeout)";
            if (id(pending_control) == 1) result += "; check mower display/physical START";
            id(last_control_command).publish_state(result);
            id(pending_control) = 255;
          }
  - interval: 10s
    then:
      - lambda: |-
          if (id(last_response_ms) != 0 &&
              (uint32_t)(millis() - id(last_response_ms)) >= 60000 &&
              !id(connection_loss_reported)) {
            id(connection_loss_reported) = true;
            id(pin_accepted) = false;
            id(pin_requested) = false;
            id(clock_sync_pending) = false;
            id(clock_sync_readback_sent) = false;
            id(pin_status).publish_state("No connection");
            id(operating_status).publish_state("No connection");
            ESP_LOGW("automower", "No valid UART response for 60 seconds");
          }
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(change_mode).is_running() &&
                     !id(synchronize_clock).is_running() &&
                     !id(apply_timer).is_running() && !id(synchronize_date_time).is_running();
          then:
            - lambda: |-
                static const uint8_t status[]   = {0x02,0x12,0x01,0x01,0x9F,0x03};
                static const uint8_t battery[]  = {0x02,0x14,0x01,0x01,0x4E,0x03};
                static const uint8_t wheels[]     = {0x02,0x14,0x01,0x02,0xAC,0x03};
                static const uint8_t blade[]     = {0x02,0x14,0x01,0x03,0xF2,0x03};
                static const uint8_t sensors[] = {0x02,0x14,0x01,0x04,0x71,0x03};
                static const uint8_t cover[]   = {0x02,0x14,0x01,0x05,0x2F,0x03};
                static const uint8_t clock[]   = {0x02,0x02,0x01,0x00,0x8B,0x03};
                static const uint8_t date[]     = {0x02,0x02,0x01,0x01,0xD5,0x03};
                static const uint8_t next_start[]    = {0x02,0x06,0x01,0x05,0x2A,0x03};

                if (id(last_response_ms) != 0 &&
                    (uint32_t)(millis() - id(last_response_ms)) < 30000 &&
                    !id(pin_requested) && !id(pin_accepted)) {
                  id(authenticate).execute();
                  return;
                }

                const uint32_t now_ms = millis();
                const bool active_connection = id(last_response_ms) != 0 &&
                    (uint32_t)(now_ms - id(last_response_ms)) < 60000;
                static uint8_t no_connection_counter = 0;
                if (!active_connection) {
                  if (++no_connection_counter < 25) return;
                  no_connection_counter = 0;
                  id(mower_uart).write_array(status, sizeof(status));
                  return;
                }
                no_connection_counter = 0;

                static uint8_t slot = 0;
                const uint8_t current_slot = slot;
                slot = (slot + 1) % 10;
                if (current_slot == 0) {
                  id(mower_uart).write_array(status, sizeof(status));
                  return;
                }
                if (current_slot == 3) {
                  id(mower_uart).write_array(wheels, sizeof(wheels));
                  return;
                }
                if (current_slot == 6) {
                  id(mower_uart).write_array(blade, sizeof(blade));
                  return;
                }

                static const uint8_t timer1_start[] = {0x02,0x06,0x02,0x01,0x01,0xDC,0x03};
                static const uint8_t timer1_end[] = {0x02,0x06,0x02,0x01,0x81,0x50,0x03};
                static const uint8_t timer2_start[] = {0x02,0x06,0x02,0x01,0x02,0x3E,0x03};
                static const uint8_t timer2_end[] = {0x02,0x06,0x02,0x01,0x82,0xB2,0x03};
                static uint32_t last_request[10] = {0,0,0,0,0,0};
                static const uint32_t periods[10] = {
                  5000, 10000, 10000, 60000, 60000, 3600000, 60000, 60000, 60000, 60000
                };
                const uint8_t *messages[10] = {
                  sensors, battery, cover, clock, next_start, date,
                  timer1_start, timer1_end, timer2_start, timer2_end
                };
                for (uint8_t i = 0; i < 10; i++) {
                  if (last_request[i] == 0 || (uint32_t)(now_ms - last_request[i]) >= periods[i]) {
                    id(mower_uart).write_array(messages[i], i < 6 ? 6 : 7);
                    last_request[i] = now_ms;
                    break;
                  }
                }

# Draft values do not send UART commands. Load, edit, then explicitly Apply.
text:
  - platform: template
    name: "Timer draft time"
    id: timer_draft_time
    mode: text
    optimistic: true
    min_length: 5
    max_length: 5
    initial_value: "00:00"
  - platform: template
    name: "Timer draft weekdays"
    id: timer_draft_days
    mode: text
    optimistic: true
    max_length: 27
    initial_value: "Mon,Tue,Wed,Thu,Fri,Sat,Sun"

switch:
  - platform: template
    name: "Allow experimental timer changes"
    id: allow_timer_changes
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
