wifi_password: "YOUR_WIFI_PASSWORD"
api_encryption_key: "YOUR_BASE64_ENCODED_32_BYTE_KEY"
ota_password: "CHOOSE_A_LONG_UNIQUE_OTA_PASSWORD"
