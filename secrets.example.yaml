# Add these keys in ESPHome Device Builder > Secrets, or copy to secrets.yaml.
# Enter your own values locally. Never commit secrets.yaml.
# PIN must contain exactly four decimal digits in quotes; leading zeros are valid.
# This placeholder intentionally cannot authenticate the mower.
automower_pin: "ENTER_FOUR_DIGITS"
